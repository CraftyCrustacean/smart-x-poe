services:
  mosquitto:
    image: eclipse-mosquitto
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 5

  provisioner:
    build:
      context: ./simulator
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - PYTHONUNBUFFERED=1
    command: ["python", "run_provision.py"]
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_healthy

  simulator:
    build:
      context: ./simulator
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - PYTHONUNBUFFERED=1
    depends_on:
      mosquitto:
        condition: service_healthy
      provisioner:
        condition: service_completed_successfully

  timescaledb:
    image: timescale/timescaledb:latest-pg18
    volumes:
     - ./init-db:/docker-entrypoint-initdb.d
     - timescaledb_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  backend:
    build:
      context: ./backend
    environment:
      - MqttSettings__MqttHost=mosquitto
      - MqttSettings__MqttPort=1883
      - DbSettings__DbHost=timescaledb
      - DbSettings__DbPort=5432
      - DbSettings__DbName=${POSTGRES_DB}
      - DbSettings__DbUser=${POSTGRES_USER}
      - DbSettings__DbPassword=${POSTGRES_PASSWORD}
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - file_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  timescaledb_data:
  file_uploads: